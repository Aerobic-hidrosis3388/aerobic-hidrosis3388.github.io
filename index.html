<script>
const DAYS=["20261107"];             
const BUILT='2026-11-07T1155';
const GATED=true;         
const NOTE_URL="";       
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ico=(n,cls)=>`<i class="${cls||''}"><svg class="ic"><use href="#i-${n}"/></svg></i>`;
const ls={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const WBG={1:'#ffffff',2:'#2b2b2b',3:'#e5342b',4:'#2f6fd0',5:'#f2cf1b',6:'#38a05a',7:'#f0870f',8:'#f0a2bd'};
const WFG={1:'#111',2:'#fff',3:'#fff',4:'#fff',5:'#111',6:'#fff',7:'#fff',8:'#111'};
const cap=h=>`<span class="cap" style="background:${WBG[h.waku]||'#ddd'};color:${WFG[h.waku]||'#111'}">${h.uno}</span>`;
const WDJ='日月火水木金土', dayLab=d=>`${+d.slice(4,6)}/${+d.slice(6,8)}（${WDJ[new Date(+d.slice(0,4),+d.slice(4,6)-1,+d.slice(6,8)).getDay()]}）`;
function ymd(d){ return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`; }
function isDark(){ return document.documentElement.getAttribute('data-theme')==='dark'; }
function thmBtn(){ return `<button class="thm" type="button" onclick="toggleTheme()" aria-label="${isDark()?'明るい画面にする':'暗い画面にする'}"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-${isDark()?'sun':'moon'}"/></svg></button>`; }
function toggleTheme(){ const dk=!isDark(); if(dk) document.documentElement.setAttribute('data-theme','dark'); else document.documentElement.removeAttribute('data-theme'); try{localStorage.setItem('sunao_theme',dk?'dark':'light');}catch(e){} renderHeader(); }
let DAY=null, DATA=null, byRid={}, VENUES=[], cur={race:null}, tab='races', SORT='uno';
const CACHE={};
function pickDay(){ const q=new URLSearchParams(location.search).get('d'); if(q&&DAYS.includes(q)) return q; const t=ymd(new Date()); if(DAYS.includes(t)) return t; const fut=DAYS.filter(d=>d>t).sort(); return fut[0]||DAYS[0]; }
async function loadDay(d){ if(CACHE[d]) return CACHE[d]; const r=await fetch(`data/${d}.json?v=${BUILT}`); const j=await r.json(); CACHE[d]=j; return j; }
async function setDay(d){ DAY=d; DATA=await loadDay(d); mergePaid(DATA,d); byRid={}; (DATA.races||[]).forEach(r=>{ byRid[r.rid]=r; (r.runners||[]).forEach(h=>{ h._rid=r.rid; }); });
  VENUES=[...new Set((DATA.races||[]).map(r=>r.venue_name))]; }
const PR=h=>h.scr?0:(h.p==null?null:h.p);
function renderHeader(){ const d=DAY||'', ds=d?`${d.slice(0,4)}.${d.slice(4,6)}.${d.slice(6,8)}`:'';
  if(tab==='race'&&cur.race&&byRid[cur.race]){ const r=byRid[cur.race]; $('#hd').innerHTML=`<button class="bk" type="button" onclick="showTab('races')"><i><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></i>${esc(r.venue_name)} R一覧</button><div class="hdr"><div class="dt"><b>${ds}</b>${d?WDJ[new Date(+d.slice(0,4),+d.slice(4,6)-1,+d.slice(6,8)).getDay()]+'曜':''}</div>${thmBtn()}</div>`; return; }

    return `<div class="rc"><div class="lg"><span><i></i>出した勝率</span><span><i class="b"></i>実際に勝った割合</span></div>${X.bands.map(b=>`<div class="rcr"><span class="rcl">${b.lo?b.lo+'〜':'〜'}${b.hi<100?b.hi+'%':''}</span><div class="rcb"><i style="width:${(b.calc/mx*100).toFixed(1)}%"></i><em style="width:${(b.real/mx*100).toFixed(1)}%"></em></div><span class="rcv"><b>${b.calc.toFixed(1)}%</b><em>${b.real.toFixed(1)}%</em><small>${b.n}頭</small></span></div>`).join('')}</div>`; };
  const blk=(X,sub)=>{ if(!X||!X.races) return `<div class="sub">${sub}</div><div class="empty">まだ記録がありません</div>`;
    return `<div class="sub">${sub}</div><div class="stat"><div><label>DAYS</label><b>${X.days}</b></div><div><label>RACES</label><b>${X.races}</b></div><div><label>HORSES</label><b>${X.horses}</b></div></div>
      ${chart(X)}
      ${(()=>{ const months=[...new Set((X.daily||[]).map(d=>String(d.d).slice(0,6)))].sort(); if(!months.includes(CALM)) CALM=months[months.length-1];
        const tabs=months.length?`<div class="mtab">${months.slice().reverse().map(m=>`<button type="button" class="${m===CALM?'on':''}" onclick="CALM='${m}';renderRecord(true)">${+m.slice(4)}月</button>`).join('')}</div>`:'';
        const rows=(X.daily||[]).filter(d=>String(d.d).slice(0,6)===CALM).slice().reverse();
        return `<div class="sub" style="margin-top:14px">日ごと（${CALM?CALM.slice(0,4)+'年'+(+CALM.slice(4))+'月':''}）</div>${tabs}<table class="t"><thead><tr><th>日付</th><th>レース</th><th>頭数</th><th>出した勝率の合計</th><th>勝った馬</th></tr></thead><tbody>${rows.map(d=>`<tr><td>${md(d.d)}</td><td>${d.races}</td><td>${d.horses}</td><td>${d.calc.toFixed(1)}</td><td>${d.wins}</td></tr>`).join('')}</tbody></table>`; })()}`; };
  el.innerHTML=`<div class="hto"><h2>${ico('chart')}記録</h2><div class="lead">期待値が<span class="k g">金</span>（1.0以上）だった馬の成績と、うまみの勝率が実際にどれだけ当たっているかを、そのまま載せています。</div>
    ${evBlk(E,md)}
    <div class="lead" style="margin-top:22px">うまみの勝率の実現度。勝率の帯ごとに、出した勝率の平均と、実際に勝った割合をくらべます。2つが近いほど、勝率が実際に合っています。</div>
    <div class="rc">${blk(X,'うまみの勝率の帯ごと'+(X?'（'+md(X.start)+'〜'+md(X.end)+'）':''))}</div>
    <div class="note" style="margin-top:18px">結果が出たレースだけ数えています。取消・除外の馬は除きます。勝率は、そのとき画面に出していたもの（発走1分前までに取った最後の勝率）です。頭数が少ない帯は、ばらつきが大きくなります。</div></div>`; }
function renderMem(){ const el=$('#s-mem');
  if(!GATED){ el.innerHTML=`<h2>${ico('user')}会員</h2><div class="box"><b>1日券は準備中</b><p>いまは全部のレースをそのまま見られます。</p></div>`; return; }
  const od=Object.keys(OPEN).filter(d=>DAYS.includes(d)).sort();
  el.innerHTML=`<h2>${ico('user')}会員</h2>
    <div class="box"><b>1日券の合い言葉</b><p>開催日ごとの合い言葉で、その日の全レースの勝率と期待値が開きます。終わった日は誰でも見られます。</p>${lockBox(DAY,'合い言葉を入れる')}</div>
    <div class="box"><b>この端末で開いている日</b>${od.length?`<div class="mem-open">${od.map(d=>`<span>${dayLab(d)}</span>`).join('')}</div>`:'<p>まだありません。</p>'}</div>
    ${NOTE_URL?`<div class="box"><b>1日券を買う</b><p>noteの記事から、その日の合い言葉を手に入れられます。</p><div class="lock" style="border:none;padding:0;margin-top:6px"><div class="buy"><a href="${esc(NOTE_URL)}" target="_blank" rel="noopener">1日券の記事一覧</a></div></div></div>`:`<div class="box"><b>1日券は準備中</b><p>買える場所が決まり次第ここに出します。</p></div>`}`; }
function renderHowto(){ const H=(n,icon,title,point,more)=>`<div class="hs"><div><i class="num"><svg class="ic"><use href="#i-${icon}"/></svg><em>${n}</em></i><b>${title}</b></div><div class="pt-box">${point}</div>${more?`<details><summary>くわしく</summary><ul>${more}</ul></details>`:''}</div>`;
  $('#s-howto').innerHTML=`<h2>${ico('book')}使い方</h2><div class="hto">
  <div class="lead">うまみは、地方競馬の全レースに「正直な勝率」と「期待値」を付けるサービスです。</div>
  <div class="qs"><div><b>1</b><span>目次でレースを押す。色の丸はレースのラベル（<em>本線・相手・穴</em>）、小さな数字は人気裏切りアラートの数です。</span></div><div><b>2</b><span>「勝率と期待値」で<em>見立て</em>を見る。1.00以上は濃い金、0.90以上は淡い金。</span></div><div><b>3</b><span>気になる馬を出馬表で押すと、近5走と騎手・調教師のこれまでが開きます。</span></div></div>
  ${H(1,'horse','勝率はどう決めている？','うまみのAIが、過去の地方の全レースから学んだ勝率です。うまみが「50%」と出した馬は、100頭いれば50頭ほど勝つ見込みです。',
    `<li>人気（オッズから見た勝ちやすさ）とは少し違います。うまみの勝率が人気より高い馬は「人気のわりに来る」、低い馬は「人気のわりに来ない」と見ている馬です。</li><li>出した勝率が本当にその通りだったかは、<b>記録</b>のタブで帯ごとに公開しています。</li>`)}
  ${H(2,'coin','期待値と金の2段','<b>期待値＝勝率×単勝オッズ</b>。勝率どおりなら、100円の単勝がいくら戻るかの倍率です。<span class="k g">1.00以上</span> は払い戻しが賭け金に見合う見込みの馬、<span class="k g2">0.90以上</span> はそれに近い馬。勝率を決めたあとにオッズが1.5倍以上に上がった馬は、色を付けません。',
    `<li>期待値は目安です。金の馬でも、外れることは多くあります。</li><li>見立て＝期待値が0.90以上の馬を勝率順に並べたもの。いなければ勝率の上位3頭。全頭＝全馬を勝率順に。</li><li>期待値はオッズで動きます。発売前は「想定」のオッズなので目安。発走が近づくほど本当の値に近づきます。</li>`)}
  ${H(3,'coin','買い方','予算と配分を選ぶと、期待値0.90以上の馬の単勝に100円単位で配った表が出ます。該当する馬がいないレースは「見送り」。',
    `<li>「勝率に比例」は勝ちやすい馬に多く、「均等」は同じ額ずつ。予算と配分はこの端末に残ります。</li><li>「的中時」はその馬が勝ったときに戻る額（いまのオッズ）。オッズを更新すると配分も出し直します。</li><li>買い目は材料です。買うかどうか、いくら買うかはご自身で決めてください。</li>`)}
  ${H(4,'flag','レースのラベル','期待値が0.90以上の馬の勝率を足して、<b>本線</b>（100レース中25勝分以上）・<b>相手</b>（10勝分以上）・<b>穴</b>（それ未満）の3つに分けています。',
    `<li>本線は「金の馬が勝ちやすいレース」。穴は「金の馬はいるが勝率は低い」ので、当たれば大きい代わりに外れやすいレースです。</li><li>目次の色の丸と、レースページの「勝率と期待値」の札に出ます。</li>`)}
  ${H(5,'alert','人気裏切りアラート','単勝5倍以下の人気馬で、<b>うまみの勝率が人気を下回る</b>か、<b>騎手・厩舎・その組み合わせ</b>が人気馬だったときに見込みより来ていない馬に札が付きます。',
    `<li>「100回中 見込み24→実際15（65回）」は、同じ人気の馬が普通どれだけ勝つかと比べた数です。回数が少ないうちは偶然の幅があります。</li><li>「やや」と「人気の割に」の2段。人気馬を軸にするときの、念のための確認に。</li><li>レースページの「人気裏切りアラート」の章に、該当する馬だけをまとめています。</li>`)}
  ${H(6,'run','脚質と札','出馬表の馬名の横に <span class="k rn r1">逃げ</span><span class="k rn r2">先行</span><span class="k rn r3">差し</span><span class="k rn r4">追込</span> の脚質と、休み明け・乗り替わり・距離の変更などの要素の札が付きます。',
    `<li>脚質は近5走で最初のコーナーをどの位置で回ったかから。逃げ・先行が多いレースは前が苦しくなりやすい、といった見方に。</li><li>乗替↑は前の騎手より勝率の高い騎手に替わった馬、乗替↓はその逆。速さ1位は近5走のいちばん速い走りがレースで1位の馬。</li><li>馬を押すと近5走の表が開き、速さ（大きいほど速い）、上りの順位（1〜3位は札）、通過順も見られます。</li>`)}
  ${H(7,'clock','オッズを更新','「オッズを更新」を押すと、その時点の単勝オッズを取り直し、期待値（勝率×単勝オッズ）を出し直します。勝率は決めた時刻の値のままで、発走30分前に1回だけ決め直します。押したあと20秒は押せません。',
    `<li>何もしなくても5分ごとに新しい値に入れ替わります。ページの上に更新した時刻が出ます。</li><li>取消になった馬は薄く表示し、残りの馬で勝率を配り直します。</li>`)}
  ${H(8,'key','合い言葉（1日券）','勝率・期待値・人気裏切りアラートは、<b>開催日ごとの合い言葉</b>で開きます。一度入れればこの端末では開いたまま。終わった日は誰でも見られます。',
    `<li>出馬表・オッズ・近5走・結果・記録は、合い言葉なしで見られます。</li><li>合い言葉は「会員」のタブか、レースページの箱に入れます。</li>`)}
  ${H(9,'chart','記録','うまみの勝率と、金の馬の成績を公開。結果が出るたびに更新。',
    `<li><span class="k g">金</span>（期待値1.00以上）だった馬の<b>単勝回収率・複勝回収率・3着内率</b>。直近の開催日の成績、通算、日ごと（月のタブ）</li><li>判定は締切時（発走1分前までに取った最後）の勝率とオッズ、払戻は確定。色の決まりは画面と同じ。締切時のオッズや結果が取れなかったレースは数えず、その数も出しています</li><li>勝率の帯ごとに、出した勝率の平均と実際に勝った割合をくらべた表</li>`)}
  ${H(10,'wind','コースと馬場','レースのページのいちばん上に、馬場状態と、直線に対する風の向きと強さを出します。')}
  ${H(11,'trophy','結果','レースが終わると、着順と払戻（100円あたり）が出ます。金だった馬の単勝の的中は金色で示します。')}
  ${H(12,'grid','中央と地方','いちばん上の<b>UMAMI 中央</b>と<b>UMAMI 地方</b>で切り替えます。中央競馬のページでは、展開・馬柱・重賞分析なども見られます。')}
  <div class="note">うまみは予想を売るサービスではなく、判断の材料を出すサービスです。馬券の購入は自己責任でお願いします。</div>
</div>`; }
function renderAll(){ renderHeader(); renderRaces(); renderRecord(); renderMem(); renderHowto(); if(cur.race&&byRid[cur.race]) renderRacePage(byRid[cur.race]); }
async function main(){ if(!DAYS.length){ $('#hd').innerHTML='<div class="wm"><i><svg class="ic" style="stroke-width:1.5"><use href="#i-face"/></svg></i><div><span class="kana">うまみ</span><small class="en">UMAMI</small></div></div>'; $('#s-races').innerHTML='<div class="pend">データがまだありません</div>'; showTab('races'); return; }
  await loadEnc(); for(const pw of (ls.get(LSK,[])||[])){ try{ await openWith(pw); }catch(e){} }
  await setDay(pickDay()); renderAll();
  const q=new URLSearchParams(location.search).get('r'); let k=ls.get('sunao_tab','races'); if(q&&byRid[q]){ openRace(q); } else { if(k==='race') k='races'; showTab(k); }
  document.querySelectorAll('.nav button[data-k]').forEach(b=>b.onclick=()=>{ const k=b.dataset.k; if(k==='up'){ window.scrollTo({top:0,behavior:'smooth'}); return; } if(k==='list'){ showTab('races'); return; } showTab(k); });
  let lastY=window.scrollY; window.addEventListener('scroll',()=>{ const y=window.scrollY; lastY=y; const rs=$('#rsel'); if(rs) rs.classList.toggle('stuck',y>40); },{passive:true});
  setInterval(async()=>{ try{ const r=await fetch(`data/${DAY}.json?t=${Date.now()}`,{cache:'no-store'}); if(r.status===404){ location.reload(); return; } const j=await r.json(); if(j.built!==DATA.built){ CACHE[DAY]=j; if(GATED){ try{ const e=await fetch(`data/enc.json?t=${Date.now()}`,{cache:'no-store'}); if(e.ok){ ENC=await e.json(); OPEN={}; for(const pw of (ls.get(LSK,[])||[])){ try{ await openWith(pw); }catch(x){} } } }catch(x){} } await setDay(DAY); const y=window.scrollY; renderAll(); window.scrollTo(0,y); } }catch(e){} },300000);    
}
main();
</script>

<script>
 
(function(){ const nav=document.querySelector('.nav'), sw=document.getElementById('sw'), sc=document.getElementById('tnavsc'); if(!nav||!sw||!sc) return;
  sw.querySelector('[data-site="c"]').onclick=function(){ if(!this.classList.contains('on')) location.href='https://umami-lab-support.github.io/'; };
  sw.querySelector('[data-site="l"]').onclick=function(){ if(!this.classList.contains('on')) location.href='https://umami-chiho.github.io/'; };
  const skip={up:1,list:1,chi:1};
  function vis(){ return [...nav.querySelectorAll('button[data-k]')].filter(b=>!skip[b.dataset.k]&&getComputedStyle(b).display!=='none'); }
  function build(){ sc.innerHTML=''; vis().forEach(b=>{ const t=document.createElement('button'); t.type='button'; t.dataset.k=b.dataset.k; t.textContent=b.textContent.trim(); t.onclick=()=>{ b.click(); sync(); }; sc.appendChild(t); }); }
  let LASTK=null; function sync(){ const on=nav.querySelector('button.on'); const k=on?on.dataset.k:null; if(k===LASTK&&sc.querySelector('button.on')) return; LASTK=k; sc.querySelectorAll('button[data-k]').forEach(t=>t.classList.toggle('on',t.dataset.k===k)); const o=sc.querySelector('button.on'); if(o){ const L=o.offsetLeft-(sc.clientWidth-o.offsetWidth)/2; if(Math.abs(sc.scrollLeft-L)>4) sc.scrollLeft=Math.max(0,L); } }
  build(); sync(); new MutationObserver(()=>{ if(sc.children.length!==vis().length){ build(); LASTK=null; } sync(); }).observe(nav,{subtree:true,attributes:true,attributeFilter:['class','style']});
})();
</script>
